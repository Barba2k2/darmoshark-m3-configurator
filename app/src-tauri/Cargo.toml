[package]
name = "darmoshark-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "darmoshark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
darmoshark = { version = "0.1.0", path = "../../crates/darmoshark" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
serde_json = "1.0.151"
